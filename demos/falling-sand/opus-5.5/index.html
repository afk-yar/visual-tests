<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Падающий песок — Claude Opus 5.5</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="sim" aria-label="Поле клеточного автомата: рисуйте веществами мышью"></canvas>
<div class="vignette" aria-hidden="true"></div>

<header class="hud">
  <h1>Падающий песок</h1>
  <p class="sub">Клеточный автомат: песок, вода, камень, дерево, огонь, дым</p>
  <p class="hint">ЛКМ — рисовать · ПКМ — стирать · колесо — размер кисти</p>
  <p class="stats" id="stats">&nbsp;</p>
</header>

<div class="panel" id="panel">
  <div class="tools" id="tools" role="radiogroup" aria-label="Вещество"></div>
  <div class="divider" aria-hidden="true"></div>
  <div class="controls">
    <label class="size" title="Размер кисти ( [ и ] )">
      <span>Кисть</span>
      <input id="size" type="range" min="1" max="30" step="1" value="6">
      <output id="sizeOut" for="size">6</output>
    </label>
    <div class="actions">
      <button class="btn" id="pauseBtn" type="button" title="Пауза (пробел)">Пауза</button>
      <button class="btn" id="stepBtn" type="button" title="Один шаг симуляции (S)" disabled>Шаг</button>
      <button class="btn" id="sceneBtn" type="button" title="Демо-сцена (R)">Сцена</button>
      <button class="btn danger" id="clearBtn" type="button" title="Очистить поле (C)">Очистить</button>
    </div>
  </div>
</div>

<script src="main.js"></script>
</body>
</html>

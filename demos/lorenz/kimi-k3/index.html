<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>«Система Лоренца» — «Kimi K3»</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="scene"></canvas>

<header class="hud">
  <h1>Система Лоренца</h1>
  <span class="tag">Kimi K3</span>
</header>

<div class="panel">
  <label>
    <span>σ <b id="v-sigma">10</b></span>
    <input id="p-sigma" type="range" min="1" max="20" step="0.1" value="10">
  </label>
  <label>
    <span>ρ <b id="v-rho">28</b></span>
    <input id="p-rho" type="range" min="0.5" max="60" step="0.1" value="28">
  </label>
  <label>
    <span>β <b id="v-beta">2.67</b></span>
    <input id="p-beta" type="range" min="0.5" max="5" step="0.01" value="2.6667">
  </label>
  <label>
    <span>Скорость <b id="v-speed">1.4</b></span>
    <input id="p-speed" type="range" min="0.2" max="4" step="0.05" value="1.4">
  </label>
  <label>
    <span>След <b id="v-trail">0.92</b></span>
    <input id="p-trail" type="range" min="0.80" max="0.985" step="0.005" value="0.92">
  </label>
  <div class="buttons">
    <button id="btn-pause" type="button">Пауза</button>
    <button id="btn-reset" type="button">Сброс</button>
  </div>
</div>

<script src="main.js"></script>
</body>
</html>

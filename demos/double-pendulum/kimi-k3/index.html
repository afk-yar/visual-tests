<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>«Двойной маятник» — «Kimi K3»</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="scene"></canvas>

<div class="hud">
  <h1>Двойной маятник</h1>
  <p>Kimi K3</p>
</div>

<div class="panel">
  <div class="row buttons">
    <button id="btnToggle" class="primary">Пауза</button>
    <button id="btnReset">Сброс</button>
    <label class="ghost-toggle">
      <input type="checkbox" id="chkGhost">
      <span>Призрак (хаос)</span>
    </label>
  </div>
  <div class="row sliders">
    <label>Масса 1 <output id="outM1">1.0</output>
      <input type="range" id="rngM1" min="0.2" max="5" step="0.1" value="1">
    </label>
    <label>Масса 2 <output id="outM2">1.0</output>
      <input type="range" id="rngM2" min="0.2" max="5" step="0.1" value="1">
    </label>
    <label>Длина 1 <output id="outL1">1.0</output>
      <input type="range" id="rngL1" min="0.4" max="2" step="0.05" value="1">
    </label>
    <label>Длина 2 <output id="outL2">1.0</output>
      <input type="range" id="rngL2" min="0.4" max="2" step="0.05" value="1">
    </label>
  </div>
</div>

<script src="main.js"></script>
</body>
</html>

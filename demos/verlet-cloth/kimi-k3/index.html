<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>«Ткань (верлет)» — «Kimi K3»</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<header class="hud">
  <h1>Ткань (верлет)</h1>
  <p>Kimi K3 · схватите ткань мышью и потяните — при сильном растяжении связи рвутся</p>
</header>

<div class="panel">
  <label>Ветер
    <input id="wind" type="range" min="0" max="2" step="0.01" value="1">
  </label>
  <label>Гравитация
    <input id="grav" type="range" min="0.2" max="2.5" step="0.01" value="1">
  </label>
  <button id="reset" type="button">Сброс</button>
</div>

<script src="main.js"></script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ткань (верлет) — Claude Sonnet 5.5</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="stage" aria-label="Симуляция ткани на верлет-интегрировании"></canvas>

<header class="hud">
  <h1>Ткань (верлет)</h1>
  <p>Схватите ткань и потяните: при сильном растяжении нити рвутся</p>
  <div class="stats" id="stats">&nbsp;</div>
</header>

<section class="panel" aria-label="Управление">
  <button class="btn" id="reset" type="button" title="Сбросить ткань (R)">
    <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M13.2 8a5.2 5.2 0 1 1-1.6-3.75M13 2.2v2.9h-2.9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Сброс
  </button>

  <div class="field">
    <span class="cap">Мышь</span>
    <div class="seg" data-key="tool" role="group" aria-label="Режим мыши">
      <button type="button" data-value="grab" aria-pressed="true">Тянуть</button>
      <button type="button" data-value="cut" aria-pressed="false">Резать</button>
    </div>
  </div>

  <div class="field">
    <span class="cap">Вид</span>
    <div class="seg" data-key="view" role="group" aria-label="Режим отрисовки">
      <button type="button" data-value="cloth" aria-pressed="true">Ткань</button>
      <button type="button" data-value="wire" aria-pressed="false">Сетка</button>
      <button type="button" data-value="stress" aria-pressed="false">Напряжение</button>
    </div>
  </div>

  <div class="field range">
    <label for="wind"><span>Ветер</span><output id="wind-out">1.0</output></label>
    <input id="wind" type="range" min="0" max="3" step="0.05" value="1">
  </div>

  <div class="field range">
    <label for="gravity"><span>Гравитация</span><output id="gravity-out">1.0</output></label>
    <input id="gravity" type="range" min="0" max="2" step="0.05" value="1">
  </div>

  <div class="field range">
    <label for="tear"><span>Порог разрыва</span><output id="tear-out">×1.9</output></label>
    <input id="tear" type="range" min="1.3" max="6" step="0.1" value="1.9">
  </div>

  <div class="field range">
    <label for="pins"><span>Крепления</span><output id="pins-out">6</output></label>
    <input id="pins" type="range" min="2" max="12" step="1" value="6">
  </div>
</section>

<script src="main.js"></script>
</body>
</html>

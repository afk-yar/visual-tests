<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D-аквариум — Claude Sonnet 5.5</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<div class="hud">
  <h1>3D-аквариум</h1>
  <p>Ручная перспективная проекция, алгоритм художника, туман воды.<br>Перетащи — повернуть камеру, колесо — приблизить.</p>
  <p class="stat" id="stat"></p>
</div>

<div class="panel" id="panel">
  <button id="bOrbit" class="on" type="button" aria-pressed="true">Облёт камеры</button>
  <button id="bFeed" type="button">Покормить</button>
  <button id="bRays" class="on" type="button" aria-pressed="true">Лучи</button>
  <button id="bBub" class="on" type="button" aria-pressed="true">Пузырьки</button>
  <label>Камера <input id="sCam" type="range" min="0" max="2.5" step="0.05" value="1"></label>
  <label>Темп <input id="sTime" type="range" min="0.2" max="2" step="0.05" value="1"></label>
</div>

<script src="main.js"></script>
</body>
</html>

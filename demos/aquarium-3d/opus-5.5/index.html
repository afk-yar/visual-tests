<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D-аквариум — Claude Opus 5.5</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="scene"></canvas>
<div class="hud">
  <h1>3D-аквариум</h1>
  <p>ручная перспектива · алгоритм художника · туман глубины</p>
</div>
<div class="panel">
  <button id="btnPause" type="button">Пауза</button>
  <button id="btnOrbit" type="button" class="on">Облёт</button>
  <label>Мутность <input id="rngFog" type="range" min="0.02" max="0.14" step="0.004" value="0.058"></label>
  <label>Свет <input id="rngLight" type="range" min="0" max="1.6" step="0.05" value="1"></label>
  <span class="hint">тяни — повернуть · колесо — ближе</span>
</div>
<script src="main.js"></script>
</body>
</html>

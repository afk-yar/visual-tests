<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SVG велосипед — Claude Sonnet 5.5</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Классический шоссейный велосипед, вид сбоку справа">
  <defs>
    <!-- металл: светлый верх, холодная тень снизу -->
    <linearGradient id="frameGrad" gradientUnits="userSpaceOnUse" x1="0" y1="180" x2="0" y2="530">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.45" stop-color="#dce6f1" />
      <stop offset="1" stop-color="#93a6bd" />
    </linearGradient>
    <linearGradient id="farGrad" gradientUnits="userSpaceOnUse" x1="0" y1="180" x2="0" y2="530">
      <stop offset="0" stop-color="#8797ad" />
      <stop offset="1" stop-color="#4d5c71" />
    </linearGradient>
    <linearGradient id="leather" gradientUnits="userSpaceOnUse" x1="0" y1="116" x2="0" y2="148">
      <stop offset="0" stop-color="#f3dcb2" />
      <stop offset="1" stop-color="#b98a52" />
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6e7ff" />
      <stop offset="1" stop-color="#3d9fd0" />
    </linearGradient>
    <linearGradient id="groundFade" gradientUnits="userSpaceOnUse" x1="-500" y1="0" x2="1700" y2="0">
      <stop offset="0" stop-color="#c9d6e6" stop-opacity="0" />
      <stop offset="0.22" stop-color="#c9d6e6" stop-opacity="0.9" />
      <stop offset="0.78" stop-color="#c9d6e6" stop-opacity="0.9" />
      <stop offset="1" stop-color="#c9d6e6" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="shadowGrad">
      <stop offset="0" stop-color="#000" stop-opacity="0.65" />
      <stop offset="1" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="gridFade" gradientUnits="userSpaceOnUse" cx="600" cy="400" r="950">
      <stop offset="0" stop-color="#fff" />
      <stop offset="1" stop-color="#000" />
    </radialGradient>
    <mask id="gridMask" maskUnits="userSpaceOnUse" x="-1500" y="-800" width="4200" height="1460">
      <rect x="-1500" y="-800" width="4200" height="1460" fill="url(#gridFade)" />
    </mask>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#7fa6d4" stroke-opacity="0.13" stroke-width="1" />
    </pattern>

    <!-- осевые линии трубок (общая геометрия для контура, заливки и блика) -->
    <g id="tHT" fill="none" stroke-linecap="round"><path d="M780.5 275L754.5 195" /></g>
    <g id="tDT" fill="none" stroke-linecap="round"><path d="M555 510L776 262" /></g>
    <g id="tTS" fill="none" stroke-linecap="round"><path d="M462 205H758" /><path d="M555 510L458.6 194.5" /></g>
    <g id="tST" fill="none" stroke-linecap="round"><path d="M555 510L330 470" /><path d="M330 470L464 212" /></g>
    <g id="tSP" fill="none" stroke-linecap="round"><path d="M458.6 194.5L445.5 151.5" /></g>
    <g id="tFK" fill="none" stroke-linecap="round"><path d="M783 283C824.7 411.4 841.4 439.3 870 470" /></g>
    <g id="tSTM" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M754.5 195.1L739.1 147.6L796 146" /></g>

    <!-- колесо в локальных координатах (центр 0,0); спицы добавляет main.js -->
    <g id="wheelArt">
      <circle r="183" fill="none" stroke="#273245" stroke-width="13" />
      <circle r="183" fill="none" stroke="#3a4a61" stroke-width="1.2" />
      <circle r="183" fill="none" stroke="#b9c8da" stroke-width="2.4" stroke-opacity="0.5" stroke-dasharray="30 1119.8" transform="rotate(40)" />
      <circle r="183" fill="none" stroke="#b9c8da" stroke-width="2.4" stroke-opacity="0.5" stroke-dasharray="30 1119.8" transform="rotate(220)" />
      <circle r="189.3" fill="none" stroke="#e8eff7" stroke-width="2" />
      <circle r="176.7" fill="none" stroke="#e8eff7" stroke-width="1.6" />
      <circle r="170.2" fill="none" stroke="#0b1016" stroke-width="7.4" />
      <circle r="170.2" fill="none" stroke="#c9d6e6" stroke-width="5" />
      <circle r="167.4" fill="none" stroke="#0b1016" stroke-width="1" />
      <g id="spokes"></g>
      <path d="M0 -167.5V-156" stroke="#0b1016" stroke-width="5" stroke-linecap="round" transform="rotate(38)" />
      <path d="M0 -167.5V-156" stroke="#ffb454" stroke-width="2.6" stroke-linecap="round" transform="rotate(38)" />
      <circle r="13.5" fill="#0f1620" stroke="#dce6f1" stroke-width="2.2" />
      <circle r="8" fill="#c9d6e6" stroke="#0b1016" stroke-width="1.5" />
      <circle r="3" fill="#0b1016" />
    </g>
  </defs>

  <!-- ===== фон: сетка-«чертёж», земля, тени ===== -->
  <g id="ground">
    <rect x="-1500" y="-800" width="4200" height="1460" fill="url(#grid)" mask="url(#gridMask)" />
    <rect x="-1500" y="660" width="4200" height="700" fill="#070b11" opacity="0.5" />
    <ellipse cx="330" cy="662" rx="160" ry="9" fill="url(#shadowGrad)" />
    <ellipse cx="870" cy="662" rx="160" ry="9" fill="url(#shadowGrad)" />
    <line x1="-500" y1="660" x2="1700" y2="660" stroke="url(#groundFade)" stroke-width="3" />
    <path id="marks1" d="M-1500 677H3000" fill="none" stroke="url(#groundFade)" stroke-width="2.4" stroke-dasharray="90 50 30 70 140 40 16 110" opacity="0.55" />
    <path id="marks2" d="M-1500 695H3000" fill="none" stroke="url(#groundFade)" stroke-width="2" stroke-dasharray="26 120 60 90 14 160 40 70" opacity="0.4" />
  </g>

  <!-- ===== дальняя сторона: перо вилки, дальние перья рамы, дальний шатун ===== -->
  <g id="far" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#0b1016">
      <use href="#tST" stroke-width="10" transform="translate(4 -4)" />
      <use href="#tFK" stroke-width="11" transform="translate(6 0)" />
    </g>
    <g stroke="url(#farGrad)">
      <use href="#tST" stroke-width="6" transform="translate(4 -4)" />
      <use href="#tFK" stroke-width="7" transform="translate(6 0)" />
    </g>
    <g id="crankFar">
      <path d="M0 -10L92 -6.5A6.5 6.5 0 0 1 92 6.5L0 10A10 10 0 0 1 0 -10Z" fill="#56667c" stroke="#0b1016" stroke-width="2" />
      <g id="pedalFar" transform="translate(92 0)">
        <rect x="-23" y="-4.5" width="46" height="9" rx="3" fill="#6d7e95" stroke="#0b1016" stroke-width="2" />
        <path d="M-18 -7V-4.5M-6 -7V-4.5M6 -7V-4.5M18 -7V-4.5M-18 4.5V7M-6 4.5V7M6 4.5V7M18 4.5V7" stroke="#8d9db2" stroke-width="2" />
      </g>
    </g>
  </g>

  <!-- ===== колёса ===== -->
  <g id="rw" transform="translate(330 470)"><g id="rwRot"><use href="#wheelArt" /></g></g>
  <g id="fw" transform="translate(870 470)"><g id="fwRot"><use href="#wheelArt" /></g></g>

  <!-- ===== ближняя сторона рамы ===== -->
  <g id="frame" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- общий тёмный контур: узлы выглядят сваренными -->
    <g stroke="#0b1016">
      <use href="#tHT" stroke-width="20" />
      <use href="#tDT" stroke-width="16" />
      <use href="#tTS" stroke-width="14" />
      <use href="#tST" stroke-width="10" />
      <use href="#tSP" stroke-width="11" />
      <use href="#tFK" stroke-width="12" />
      <use href="#tSTM" stroke-width="12" />
    </g>
    <!-- металл -->
    <g stroke="url(#frameGrad)">
      <use href="#tHT" stroke-width="16" />
      <use href="#tDT" stroke-width="12" />
      <use href="#tTS" stroke-width="10" />
      <use href="#tST" stroke-width="6" />
      <use href="#tSP" stroke-width="7" />
      <use href="#tFK" stroke-width="8" />
      <use href="#tSTM" stroke-width="8" />
    </g>
    <!-- блик -->
    <g stroke="#ffffff" stroke-opacity="0.6" transform="translate(-2.2 -2.2)">
      <use href="#tHT" stroke-width="1.6" />
      <use href="#tDT" stroke-width="1.6" />
      <use href="#tTS" stroke-width="1.6" />
    </g>

    <!-- чашки рулевой колонки, коронка вилки, проставка -->
    <g stroke="#0b1016" stroke-width="8">
      <path d="M745.9 197.9L763.1 192.3M771.9 277.8L789.1 272.2M773.5 285.7L792.5 279.5M742.9 182.1L756.3 177.7M451.9 196.5L465.3 192.5" />
    </g>
    <g stroke="#dce6f1" stroke-width="4.4">
      <path d="M745.9 197.9L763.1 192.3M771.9 277.8L789.1 272.2M742.9 182.1L756.3 177.7M451.9 196.5L465.3 192.5" />
      <path d="M773.5 285.7L792.5 279.5" stroke-width="5.6" />
    </g>

    <!-- узлы: каретка, подседельный узел, вынос, втулки -->
    <circle cx="555" cy="510" r="14" fill="url(#frameGrad)" stroke="#0b1016" stroke-width="2.5" />
    <circle cx="463" cy="208" r="9" fill="url(#frameGrad)" stroke="#0b1016" stroke-width="2.5" />
    <circle cx="467.5" cy="191.5" r="2.2" fill="#0b1016" stroke="none" />
    <circle cx="796" cy="146" r="8.5" fill="url(#frameGrad)" stroke="#0b1016" stroke-width="2.5" />
    <circle cx="796" cy="146" r="2.6" fill="#0b1016" stroke="none" />
    <circle cx="748" cy="148" r="2.4" fill="#0b1016" stroke="none" />
    <circle cx="424.3" cy="288.3" r="5" fill="url(#frameGrad)" stroke="#0b1016" stroke-width="2" />
    <circle cx="330" cy="470" r="10.5" fill="url(#frameGrad)" stroke="#0b1016" stroke-width="2.5" />
    <circle cx="330" cy="470" r="3.6" fill="#0b1016" stroke="none" />
    <circle cx="870" cy="470" r="10.5" fill="url(#frameGrad)" stroke="#0b1016" stroke-width="2.5" />
    <circle cx="870" cy="470" r="3.6" fill="#0b1016" stroke="none" />
    <path d="M870 470L884 493" stroke="#0b1016" stroke-width="7" />
    <path d="M870 470L884 493" stroke="#dce6f1" stroke-width="3.6" />
    <circle cx="885" cy="495" r="3.6" fill="#dce6f1" stroke="#0b1016" stroke-width="1.6" />
  </g>

  <!-- ===== бидон на нижней трубе ===== -->
  <g id="bottle" transform="translate(645 376) rotate(-48.3)">
    <path d="M-30 14V23M26 14V23" stroke="#0b1016" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M-30 14V23M26 14V23" stroke="#c9d6e6" stroke-width="2.4" stroke-linecap="round" fill="none" />
    <rect x="-50" y="-14" width="100" height="28" rx="9" fill="url(#bottleGrad)" stroke="#0b1016" stroke-width="2.2" />
    <rect x="-34" y="-5" width="46" height="10" rx="5" fill="#eaf8ff" opacity="0.88" />
    <path d="M47 -9L58 -7V7L47 9Z" fill="#eaf2fc" stroke="#0b1016" stroke-width="2" stroke-linejoin="round" />
    <rect x="57" y="-3" width="6" height="6" rx="2" fill="#ffb454" stroke="#0b1016" stroke-width="1.6" />
    <path d="M-44 -8Q-44 -11 -38 -11" fill="none" stroke="#fff" stroke-opacity="0.65" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- ===== привод: звезда, звёздочка, цепь (геометрию строит main.js) ===== -->
  <g id="drive">
    <g id="ringRot">
      <path id="ringBody" fill="#cfdbe9" fill-rule="evenodd" stroke="#0b1016" stroke-width="1.6" stroke-linejoin="round" />
      <g id="spider"></g>
    </g>
    <g id="cogRot">
      <path id="cogBody" fill="#cfdbe9" fill-rule="evenodd" stroke="#0b1016" stroke-width="1.4" stroke-linejoin="round" />
    </g>
    <path id="chainShadow" fill="none" stroke="#0b1016" stroke-opacity="0.55" stroke-width="7.6" stroke-linejoin="round" />
    <path id="chainA" fill="none" stroke="#e3ecf6" stroke-width="5.2" stroke-linecap="round" />
    <path id="chainB" fill="none" stroke="#9fb2c9" stroke-width="3.8" stroke-linecap="round" />
    <path id="chainPins" fill="none" stroke="#0b1016" stroke-width="2.6" stroke-linecap="round" />
  </g>

  <!-- ===== ближний шатун с педалью ===== -->
  <g id="crankNear">
    <path d="M0 -10L92 -6.5A6.5 6.5 0 0 1 92 6.5L0 10A10 10 0 0 1 0 -10Z" fill="#dfe8f3" stroke="#0b1016" stroke-width="2" />
    <path d="M6 -6L88 -3.6" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.6" stroke-linecap="round" />
    <circle r="5.5" fill="#0b1016" />
    <circle r="2.6" fill="#c9d6e6" />
    <g id="pedalNear" transform="translate(92 0)">
      <rect x="-23" y="-4.5" width="46" height="9" rx="3" fill="#c9d6e6" stroke="#0b1016" stroke-width="2" />
      <path d="M-18 -7V-4.5M-6 -7V-4.5M6 -7V-4.5M18 -7V-4.5M-18 4.5V7M-6 4.5V7M6 4.5V7M18 4.5V7" stroke="#9fb2c9" stroke-width="2" />
      <circle r="3.4" fill="#0b1016" stroke="#dfe8f3" stroke-width="1.4" />
    </g>
  </g>

  <!-- ===== седло и подседельный штырь ===== -->
  <g id="saddle">
    <path d="M396 147C410 156 430 157 446 155C470 153 492 147 504 139" fill="none" stroke="#0b1016" stroke-width="5" stroke-linecap="round" />
    <path d="M396 147C410 156 430 157 446 155C470 153 492 147 504 139" fill="none" stroke="#c9d6e6" stroke-width="2.4" stroke-linecap="round" />
    <rect x="433" y="147.5" width="24" height="9" rx="3" fill="url(#frameGrad)" stroke="#0b1016" stroke-width="2" />
    <path d="M372 134C372 123 384 117 402 118C436 119 470 128 500 121C512 118 524 119 524 126C524 133 512 137 498 138C470 140 440 147 410 147C386 147 372 143 372 134Z" fill="url(#leather)" stroke="#0b1016" stroke-width="2.4" stroke-linejoin="round" />
    <path d="M381 133C402 138 432 139 468 131" fill="none" stroke="#fff3da" stroke-opacity="0.75" stroke-width="1.4" stroke-dasharray="4 3" stroke-linecap="round" />
    <path d="M384 124C392 120 404 120 414 122" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- ===== руль, ручки, тросы, тормоза ===== -->
  <g id="cockpit" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- тросы: тёмная подложка и сама рубашка -->
    <!-- оба троса выходят из-под кожуха и идут вдоль низа руля; передний сворачивает к вилке коротким изгибом, задний ложится вдоль верхней трубы -->
    <g stroke="#0b1016" stroke-opacity="0.7" stroke-width="4.2">
      <path d="M852 156L814 156C802 156 797 170 796 186C795 222 802 252 806 283" />
      <path d="M852 153L812 153C796 153 790 166 782 178C776 188 772 192 764 194L486 194C476 194 472 204 470 215L437 279" />
    </g>
    <path id="cableF" d="M852 156L814 156C802 156 797 170 796 186C795 222 802 252 806 283" stroke="#8fa0b6" stroke-width="1.9" />
    <path id="cableR" d="M852 153L812 153C796 153 790 166 782 178C776 188 772 192 764 194L486 194C476 194 472 204 470 215L437 279" stroke="#8fa0b6" stroke-width="1.9" />
    <g fill="#8fa0b6" stroke="#0b1016" stroke-width="1.4">
      <circle cx="806" cy="283" r="2.8" /><circle cx="437" cy="279" r="2.8" />
      <rect x="474" y="190" width="7" height="8" rx="1.5" /><rect x="758" y="190" width="7" height="8" rx="1.5" />
    </g>

    <!-- дропы руля: тёмный контур, металл, обмотка -->
    <!-- одна гладкая кривая: верх от выноса, дуга вперёд-вниз (радиус 38), хват назад -->
    <path d="M796 146H832C853 146 870 163 870 184C870 205 853 222 832 222H804" stroke="#0b1016" stroke-width="12" />
    <path d="M796 146H832C853 146 870 163 870 184C870 205 853 222 832 222H804" stroke="url(#frameGrad)" stroke-width="8" />
    <!-- обмотка идёт по той же кривой от кожуха до заглушки -->
    <path d="M822 146H832C853 146 870 163 870 184C870 205 853 222 832 222H804" stroke="#0b1016" stroke-width="12" stroke-linecap="butt" />
    <path d="M822 146H832C853 146 870 163 870 184C870 205 853 222 832 222H804" stroke="#2c3849" stroke-width="9" stroke-linecap="butt" />
    <path d="M822 146H832C853 146 870 163 870 184C870 205 853 222 832 222H804" stroke="#8fa3bb" stroke-width="9" stroke-linecap="butt" stroke-dasharray="2.2 5.4" />
    <circle cx="803" cy="222" r="4.6" fill="#dce6f1" stroke="#0b1016" stroke-width="2" />

    <!-- кожух тормозной ручки -->
    <path d="M820 152V141C836 131 857 125 871 128C886 132 895 145 892 157C890 165 883 170 875 172L866 170C860 162 850 156 840 154Z" fill="#3a4658" stroke="#a9bbd1" stroke-width="1.6" />
    <path d="M830 139C846 132 860 129 872 132" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.6" />
    <circle cx="886" cy="163" r="3" fill="#0b1016" stroke="#dce6f1" stroke-width="1.4" />
    <!-- рычаг висит на переднем изгибе (поворачивается вокруг оси 886,163 при торможении) -->
    <g id="leverF">
      <path d="M886 163C900 176 900 198 884 216" stroke="#0b1016" stroke-width="9" />
      <path d="M886 163C900 176 900 198 884 216" stroke="url(#frameGrad)" stroke-width="5" />
    </g>
  </g>

  <!-- ===== ободные тормоза (калипер + колодка) ===== -->
  <g id="brakes" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g id="calF">
      <path d="M791 288C809 289 813 302 799 310" stroke="#0b1016" stroke-width="9" />
      <path d="M791 288C809 289 813 302 799 310" stroke="url(#frameGrad)" stroke-width="5" />
      <rect id="padF" x="-8" y="-3.5" width="16" height="7" rx="2.5" fill="#aab9cc" stroke="#0b1016" stroke-width="1.8" transform="translate(797 312) rotate(-24.8)" />
    </g>
    <g id="calR">
      <path d="M424 289C441 296 432 313 412 313" stroke="#0b1016" stroke-width="9" />
      <path d="M424 289C441 296 432 313 412 313" stroke="url(#frameGrad)" stroke-width="5" />
      <rect id="padR" x="-8" y="-3.5" width="16" height="7" rx="2.5" fill="#aab9cc" stroke="#0b1016" stroke-width="1.8" transform="translate(410 316) rotate(27.4)" />
    </g>
    <circle cx="791" cy="288" r="4.6" fill="#dce6f1" stroke="#0b1016" stroke-width="2" />
    <circle cx="424" cy="289" r="3.8" fill="#dce6f1" stroke="#0b1016" stroke-width="2" />
  </g>

  <!-- ===== подсветка двух треугольников рамы ===== -->
  <g id="tri">
    <polygon points="462,205 758,205 776,262 555,510" fill="#52c8ff" fill-opacity="0.16" stroke="#52c8ff" stroke-width="2" stroke-dasharray="7 6" stroke-linejoin="round" />
    <polygon points="555,510 330,470 464,212" fill="#ffb454" fill-opacity="0.18" stroke="#ffb454" stroke-width="2" stroke-dasharray="7 6" stroke-linejoin="round" />
    <text x="618" y="258" text-anchor="middle" fill="#8fdcff">передний треугольник</text>
    <text x="440" y="420" text-anchor="middle" fill="#ffd08a">задний треугольник</text>
  </g>

  <g id="labels"></g>
</svg>

<div id="hud">
  <h1>SVG велосипед</h1>
  <p>Ромбовидная рама из двух треугольников, цепной привод и ободные тормоза. Всё нарисовано векторными примитивами.</p>
  <p id="stat" class="stat"></p>
</div>

<div id="panel" role="group" aria-label="Управление">
  <button id="btnPlay" class="btn" type="button">Пауза</button>
  <label class="slider">Каденс
    <input id="rngSpeed" type="range" min="0" max="45" step="1" value="16" />
    <output id="outSpeed" for="rngSpeed">16 об/мин</output>
  </label>
  <button id="btnBrake" class="btn" type="button" title="Удерживайте (клавиша B)">Тормоз</button>
  <label class="chip"><input id="chkTri" type="checkbox" /><span>Треугольники</span></label>
  <label class="chip"><input id="chkLab" type="checkbox" /><span>Подписи</span></label>
</div>

<script src="main.js"></script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SVG велосипед — GPT-5.6 Luna</title>
  <style>
    :root { color-scheme: dark; --night:#090e1b; --ink:#eef4ff; --muted:#8a9ab3; --line:#d8e4f5; --cyan:#61e4ff; --violet:#9d8cff; --warm:#ffc86d; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin:0; min-height:100dvh; display:grid; place-items:center; overflow:hidden; background:radial-gradient(circle at 50% 42%, #15213b 0, #0d1527 34%, var(--night) 72%); color:var(--ink); font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .scene { width:min(96vw, 1240px); filter:drop-shadow(0 24px 34px rgba(0,0,0,.34)); }
    svg { display:block; width:100%; height:auto; }
    .label { font-size:14px; font-weight:700; letter-spacing:.22em; text-transform:uppercase; fill:var(--muted); }
    .wheel-spoke { stroke:#7990ae; stroke-width:2; opacity:.7; }
    @media (max-width:720px) { body { overflow:auto; padding:18px 0; } .scene { width:1120px; max-width:none; transform:scale(.82); transform-origin:center center; margin:-68px 0; } }
    @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto !important; } }
  </style>
</head>
<body>
  <main class="scene">
    <svg viewBox="0 0 1200 760" role="img" aria-labelledby="bike-title bike-desc" xmlns="http://www.w3.org/2000/svg">

      <desc id="bike-desc">Светлый дорожный велосипед на тёмном фоне: два колеса со спицами, ромбовидная рама из двух треугольников, цепь, шатуны, педали, руль и тормозные механизмы.</desc>

        <linearGradient id="rimGradient" x1="0" y1="280" x2="0" y2="670" gradientUnits="userSpaceOnUse"><stop stop-color="#f5f8ff"/><stop offset=".5" stop-color="#91a4bf"/><stop offset="1" stop-color="#e4edf9"/></linearGradient>
        <linearGradient id="saddleGradient" x1="470" y1="220" x2="570" y2="255" gradientUnits="userSpaceOnUse"><stop stop-color="#fff0bd"/><stop offset="1" stop-color="#e1a95e"/></linearGradient>
        <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

        <line id="spokeF" x1="900" y1="480" x2="900" y2="304" class="wheel-spoke"/>

      <g id="wheels" aria-label="Колёса со спицами">

            <use href="#spokeF" transform="rotate(90 900 480)"/><use href="#spokeF" transform="rotate(112.5 900 480)"/><use href="#spokeF" transform="rotate(135 900 480)"/><use href="#spokeF" transform="rotate(157.5 900 480)"/>
            <use href="#spokeF" transform="rotate(180 900 480)"/><use href="#spokeF" transform="rotate(202.5 900 480)"/><use href="#spokeF" transform="rotate(225 900 480)"/><use href="#spokeF" transform="rotate(247.5 900 480)"/>

        </g>

        <path d="M380 453 L590 433 M380 507 L590 527" stroke="#61e4ff" stroke-width="2" opacity=".8"/>
        <g stroke="#9db0ca" stroke-width="2" opacity=".9"><path d="M400 450l-3 12M420 448l-3 12M440 446l-3 12M460 444l-3 12M480 442l-3 12M500 440l-3 12M520 438l-3 12M540 436l-3 12M560 434l-3 12"/><path d="M400 496l-3 12M420 498l-3 12M440 500l-3 12M460 502l-3 12M480 504l-3 12M500 506l-3 12M520 508l-3 12M540 510l-3 12M560 512l-3 12"/></g>

        <g stroke="#b9c9dc" stroke-width="3"><path d="M590 480L590 439M590 480L629 467M590 480L616 513M590 480L564 513M590 480L551 467"/></g>
        <circle cx="590" cy="480" r="9" fill="#61e4ff" stroke="#ecf8ff" stroke-width="3"/>
        <path d="M590 480L627 442" fill="none" stroke="#d8e4f5" stroke-width="9" stroke-linecap="round"/><rect x="623" y="432" width="49" height="13" rx="6.5" fill="#eef4ff" transform="rotate(-43 623 432)"/>
        <path d="M590 480L552 521" fill="none" stroke="#d8e4f5" stroke-width="9" stroke-linecap="round"/><rect x="515" y="520" width="49" height="13" rx="6.5" fill="#eef4ff" transform="rotate(-43 515 520)"/>
      </g>

      <g id="frame" aria-label="Ромбовидная рама из двух треугольников">
        <path d="M380 480 L520 270 L590 480 Z" fill="rgba(97,228,255,.055)" stroke="url(#frameGradient)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M520 270 L795 294 L590 480 Z" fill="rgba(157,140,255,.06)" stroke="url(#frameGradient)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M380 480 L520 270 M520 270 L795 294 M795 294 L590 480 M590 480 L380 480" stroke="#f3f7ff" stroke-width="3" opacity=".85" stroke-linecap="round"/>
        <circle cx="520" cy="270" r="16" fill="#0b1221" stroke="#eff6ff" stroke-width="5"/><circle cx="590" cy="480" r="15" fill="#0b1221" stroke="#eff6ff" stroke-width="5"/><circle cx="795" cy="294" r="15" fill="#0b1221" stroke="#eff6ff" stroke-width="5"/><circle cx="380" cy="480" r="12" fill="#0b1221" stroke="#eff6ff" stroke-width="4"/>
      </g>

      <g id="fork-and-steering" aria-label="Рулевая труба и вилка">

        <path d="M810 354 L886 481" fill="none" stroke="#6e829f" stroke-width="5" stroke-linecap="round"/>

        <path d="M380 480 L520 270" fill="none" stroke="#eef4ff" stroke-width="8" stroke-linecap="round"/><path d="M380 480 L590 480" fill="none" stroke="#7f95b1" stroke-width="5" stroke-linecap="round"/>
        <path d="M795 294 L808 237" fill="none" stroke="#eef4ff" stroke-width="11" stroke-linecap="round"/>
        <path d="M808 240 C792 231 774 226 752 229 C739 231 731 240 732 251 C733 261 744 267 756 264" fill="none" stroke="#eef4ff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M750 230L737 218M756 264L744 274" stroke="#61e4ff" stroke-width="5" stroke-linecap="round"/><path d="M738 218L724 214M744 274L730 281" stroke="#eef4ff" stroke-width="5" stroke-linecap="round"/>
        <path d="M741 220 C762 258 790 284 809 320" fill="none" stroke="#ffc86d" stroke-width="2" opacity=".85"/><path d="M744 220 C770 253 797 278 813 320" fill="none" stroke="#ffc86d" stroke-width="2" opacity=".5"/>

        <path d="M737 218 C710 246 700 300 711 343 C721 382 735 414 733 454" fill="none" stroke="#ffc86d" stroke-width="2" opacity=".7"/><path d="M744 274 C660 309 590 318 520 270" fill="none" stroke="#ffc86d" stroke-width="2" opacity=".5"/>
      </g>

      <g aria-hidden="true"><circle cx="900" cy="480" r="8" fill="#61e4ff" stroke="#f2f8ff" stroke-width="3"/><circle cx="380" cy="480" r="8" fill="#61e4ff" stroke="#f2f8ff" stroke-width="3"/></g>
      <g aria-hidden="true" filter="url(#softGlow)" opacity=".18"><circle cx="520" cy="270" r="18" fill="#61e4ff"/><circle cx="795" cy="294" r="18" fill="#9d8cff"/><circle cx="590" cy="480" r="21" fill="#61e4ff"/></g>

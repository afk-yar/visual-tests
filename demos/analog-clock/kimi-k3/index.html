<!DOCTYPE html>

<head>

<title>«Аналоговые часы» — «Kimi K3»</title>

<body>
<canvas id="clock"></canvas>

<header class="hud">
  <h1>Аналоговые часы</h1>
  <p>Canvas 2D &middot; реальное системное время</p>
</header>

<footer class="panel">

  <div class="seg" role="group" aria-label="Режим секундной стрелки">
    <button id="btnSweep" class="seg-btn active" type="button">Плавный ход</button>
    <button id="btnTick" class="seg-btn" type="button">Тиканье</button>
  </div>

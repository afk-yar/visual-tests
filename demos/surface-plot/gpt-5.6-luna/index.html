<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>3D-поверхность функции — GPT-5.6 Luna</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="app-shell">
      <canvas id="surfaceCanvas" aria-label="Анимированная 3D-поверхность математической функции"></canvas>

      <section class="hud" aria-labelledby="pageTitle">
        <div class="eyebrow"><span class="signal-dot" aria-hidden="true"></span> CANVAS 2D / REAL-TIME MESH</div>
        <h1 id="pageTitle">Поверхность функции</h1>
        <p id="functionDescription">Затухающая рябь — волна расходится от центра и постепенно затихает.</p>
        <div class="metric-row" aria-live="polite">
          <span class="metric-chip"><span class="metric-label">СЕТКА</span><strong id="meshMetric">42 × 42</strong></span>
          <span class="metric-chip"><span class="metric-label">РЕЖИМ</span><strong id="modeMetric">РЯБЬ</strong></span>
          <span class="metric-chip"><span class="metric-label">СВЕТ</span><strong>ЛАМБЕРТ</strong></span>
        </div>
      </section>

      <aside class="control-panel" aria-label="Панель управления поверхностью">
        <div class="panel-heading">
          <div>
            <span class="panel-kicker">SURFACE LAB / 01</span>
            <h2>Параметры сцены</h2>
          </div>
          <span class="live-badge"><span class="live-dot" aria-hidden="true"></span> LIVE</span>
        </div>

        <div class="control-grid">
          <label class="field field-wide" for="functionSelect">
            <span>Функция</span>
            <select id="functionSelect">
              <option value="ripple">Рябь · sin(r − t) / r</option>
              <option value="saddle">Седло · (x² − y²) / 8</option>
              <option value="gaussian">Гауссиана · e^(−r²)</option>
            </select>
          </label>
          <label class="field" for="speedRange">
            <span>Скорость волны <output id="speedValue">1.0×</output></span>
            <input id="speedRange" type="range" min="0" max="2" step="0.1" value="1">
          </label>
          <label class="field" for="lightRange">
            <span>Высота света <output id="lightValue">42°</output></span>
            <input id="lightRange" type="range" min="12" max="78" step="1" value="42">
          </label>
        </div>

        <div class="panel-footer">
          <label class="switch-control" for="wireToggle">
            <input id="wireToggle" type="checkbox" checked>
            <span class="switch" aria-hidden="true"><span></span></span>
            <span>Каркас</span>
          </label>
          <button id="pauseButton" class="action-button" type="button" aria-pressed="false">
            <span class="pause-glyph" aria-hidden="true">Ⅱ</span><span id="pauseLabel">Пауза</span>
          </button>
        </div>
      </aside>

      <div class="canvas-hint" aria-hidden="true"><span>AUTO</span> камера вращается медленно</div>
    </main>
    <script src="main.js"></script>
  </body>
</html>

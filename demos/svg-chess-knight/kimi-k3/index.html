<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>«SVG шахматный конь» — «Kimi K3»</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d11; }
  svg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hud {
    position: fixed; top: 18px; left: 22px; z-index: 2;
    font: 11px/1.5 system-ui, "Segoe UI", sans-serif;
    color: #6b7482; letter-spacing: .18em; text-transform: uppercase;
    user-select: none; pointer-events: none;
  }
  .hud b { color: #b8c0cd; font-weight: 600; letter-spacing: .22em; }
  .tag {
    position: fixed; bottom: 16px; right: 22px; z-index: 2;
    font: 10px/1 system-ui, "Segoe UI", sans-serif;
    color: #4c545f; letter-spacing: .2em; text-transform: uppercase;
    user-select: none; pointer-events: none;
  }
</style>
</head>
<body>
<div class="hud"><b>Шахматный конь</b><br>векторный силуэт · SVG</div>
<div class="tag">Kimi K3</div>

<svg viewBox="0 0 408 480" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Фигурка шахматного коня">
  <defs>
    <!-- Фон: тёмная сцена с мягкой виньеткой -->
    <radialGradient id="bg" cx="50%" cy="38%" r="85%">
      <stop offset="0%"  stop-color="#272e39"/>
      <stop offset="55%" stop-color="#151a21"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </radialGradient>
    <!-- Световое пятно за фигурой -->
    <radialGradient id="spot" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#aebdd2" stop-opacity=".10"/>
      <stop offset="70%" stop-color="#aebdd2" stop-opacity=".03"/>
      <stop offset="100%" stop-color="#aebdd2" stop-opacity="0"/>
    </radialGradient>
    <!-- Объём фигуры: слоновая кость, свет слева-сверху -->
    <linearGradient id="fig" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#faf7ef"/>
      <stop offset="45%" stop-color="#e6dfcd"/>
      <stop offset="100%" stop-color="#b0a896"/>
    </linearGradient>
    <!-- Отражение в полу под пьедесталом -->
    <linearGradient id="refl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8d2c2" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#d8d2c2" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur6" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#000000" flood-opacity=".5"/>
    </filter>
  </defs>

  <!-- сцена -->
  <rect x="0" y="0" width="408" height="480" fill="url(#bg)"/>
  <ellipse cx="204" cy="215" rx="195" ry="235" fill="url(#spot)"/>

  <!-- тень и отражение на «полу» -->
  <ellipse cx="205" cy="443" rx="155" ry="11" fill="#000000" opacity=".45" filter="url(#blur6)"/>
  <path d="M 122 446 Q 205 438 292 446 L 278 468 Q 205 474 132 468 Z" fill="url(#refl)"/>

  <!-- ================= КОНЬ ================= -->
  <g filter="url(#softShadow)">
    <!-- Силуэт Staunton-профиля, мордой влево. Обводка против часовой:
         низ пьедестала → грудь → горло → щёка/челюсть → морда → лоб →
         уши → грива (фестоны) → спина → пьедестал.
         Шея массивная, единая S-кривая: горлового перехвата нет,
         ширина шеи на уровне гортани ~80 усл. ед. -->
    <path fill="url(#fig)" stroke="rgba(18,20,24,.38)" stroke-width="2" stroke-linejoin="round" d="
      M 88 432
      Q 76 432 76 420
      L 76 402
      Q 76 390 88 388
      L 118 388
      C 120 370 124 352 132 336
      C 140 318 152 302 168 290
      C 184 278 198 266 208 254
      C 214 246 218 240 222 234
      C 214 250 200 256 186 254
      C 170 252 158 245 148 236
      C 142 232 140 228 142 224
      C 134 220 126 216 120 212
      Q 110 206 112 198
      Q 114 190 124 186
      C 134 178 146 170 158 162
      C 172 156 190 148 204 130
      C 210 126 214 122 218 118
      L 228 74
      L 246 100
      L 262 70
      L 276 108
      C 282 118 286 128 288 140
      C 292 152 294 162 294 172
      C 306 176 310 184 306 192
      C 303 197 299 201 296 206
      C 293 214 291 222 290 230
      C 302 234 306 242 302 250
      C 299 255 295 259 292 264
      C 289 272 287 280 286 288
      C 298 292 301 300 296 308
      C 292 313 287 317 282 321
      C 292 340 302 356 310 370
      C 316 378 320 384 322 388
      Q 334 390 334 402
      L 334 420
      Q 334 432 322 432
      Z"/>

    <!-- глаз: миндалевидный, над челюстной дугой -->
    <path fill="#23262c" d="M 175 170 Q 186 159 202 163 Q 191 173 175 170 Z"/>
    <circle cx="188" cy="164" r="1.4" fill="#f2eee2" opacity=".85"/>

    <!-- ноздря -->
    <path fill="#23262c" opacity=".9" d="M 124 189 Q 132 187 133 194 Q 128 200 122 196 Z"/>

    <!-- линия рта -->
    <path d="M 147 231 Q 134 222 124 214" fill="none"
          stroke="#3a3f47" stroke-width="2" stroke-linecap="round" opacity=".35"/>

    <!-- грива: две гравированные пряди вдоль верхней линии шеи -->
    <path d="M 276 128 Q 284 170 280 220 Q 276 266 262 306" fill="none"
          stroke="#3a3f47" stroke-width="2.6" stroke-linecap="round" opacity=".30"/>
    <path d="M 266 148 Q 272 190 266 240 Q 261 280 248 312" fill="none"
          stroke="#3a3f47" stroke-width="2.2" stroke-linecap="round" opacity=".22"/>

    <!-- свет: блик по лбу и по груди (строго внутри силуэта) -->
    <path d="M 200 142 Q 178 156 160 172" fill="none"
          stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".20"/>
    <path d="M 148 326 Q 158 306 176 292" fill="none"
          stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".16"/>
  </g>
</svg>
</body>
</html>

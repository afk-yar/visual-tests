<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVG шахматный конь — Claude Opus 5.5</title>
<style>
  :root {
    /* слоновая кость */
    --b0: #fffaf0; --b1: #efe3c9; --b2: #cfb792; --b3: #957a58;
    --base0: #6f5b42; --base1: #b39c78; --base2: #f7eedd; --base3: #e6d5b4;
    --base4: #bba27b; --base5: #86704f; --base6: #5e4b35;
    --hl: #fffdf6; --sh: #3a2410;
    --groove: #5a3d22; --groove-o: .55; --ghl: #fffaf0; --ghl-o: .7;
    --eye: #22160d; --eye-iris: #6a4526;
    --rimk: rgba(255, 248, 232, .9); --rimb: rgba(190, 210, 255, .5);
    --hl-k: 1;
    --bg0: #2c313d; --bg1: #161920; --bg2: #07080b;
    --accent: #f0c46e;
  }
  :root[data-theme="ebony"] {
    --b0: #5d5866; --b1: #312e37; --b2: #1b191f; --b3: #0d0c0f;
    --base0: #07070a; --base1: #1f1d24; --base2: #5a5563; --base3: #35323b;
    --base4: #1a181e; --base5: #0e0d11; --base6: #060608;
    --hl: #b9c3de; --sh: #000;
    --groove: #000; --groove-o: .8; --ghl: #aab5d6; --ghl-o: .3;
    --eye: #020203; --eye-iris: #23212b;
    --rimk: rgba(205, 216, 242, .6); --rimb: rgba(150, 180, 245, .9);
    --hl-k: .6;
    --bg0: #3b4150; --bg1: #1b1e26; --bg2: #08090c;
    --accent: #8fb4ff;
  }

  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(120% 95% at 50% 40%, var(--bg0) 0%, var(--bg1) 48%, var(--bg2) 100%);
    color: #ece8df;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  stop { transition: stop-color .6s ease; }
  .fb  { fill: url(#gBody); }
  .fbs { fill: url(#gBase); }
  .shf { fill: var(--sh); }
  .hlf { fill: var(--hl); }
  .hls { stroke: var(--hl); fill: none; }
  .hl-group { opacity: var(--hl-k); transition: opacity .6s ease; }
  .grv    { fill: var(--groove); opacity: var(--groove-o); }
  .grv-hl { fill: var(--ghl);    opacity: var(--ghl-o); }
  .str    { fill: var(--groove); opacity: calc(var(--groove-o) * .55); }
  .str-hl { fill: var(--ghl);    opacity: calc(var(--ghl-o) * .55); }
  .eye  { fill: var(--eye); }
  .rimk { stroke: var(--rimk); fill: none; }
  .rimb { stroke: var(--rimb); fill: none; }

  .piece { transition: opacity .5s ease; }
  #wire { opacity: 0; transition: opacity .5s ease; pointer-events: none; }
  .wire-on .piece { opacity: .2; }
  .wire-on #wire { opacity: 1; }
  .w-path   { fill: none; stroke: var(--accent); stroke-width: 1.3; stroke-linejoin: round; }
  .w-handle { stroke: var(--accent); stroke-opacity: .5; stroke-width: 1; }
  .w-ctrl   { fill: #14161c; stroke: var(--accent); stroke-width: 1.1; }
  .w-anchor { fill: #ffffff; stroke: #14161c; stroke-width: .8; }

  .hud {
    position: fixed; top: 20px; left: 24px; pointer-events: none;
    text-shadow: 0 1px 12px rgba(0, 0, 0, .5);
  }
  .hud h1 {
    margin: 0 0 4px; font-size: 17px; font-weight: 600; letter-spacing: .02em; color: #f3eee4;
  }
  .hud p { margin: 0; font-size: 12.5px; line-height: 1.45; color: rgba(236, 232, 223, .58); }

  .panel {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; padding: 7px;
    border-radius: 15px;
    background: rgba(24, 26, 33, .42);
    border: 1px solid rgba(255, 255, 255, .1);
    box-shadow: 0 12px 34px rgba(0, 0, 0, .38), inset 0 1px 0 rgba(255, 255, 255, .06);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    backdrop-filter: blur(14px) saturate(140%);
    white-space: nowrap;
  }
  .seg { display: flex; gap: 2px; padding: 3px; border-radius: 11px; background: rgba(0, 0, 0, .22); }
  .panel button {
    appearance: none; border: 0; cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: 500; line-height: 1;
    color: rgba(236, 232, 223, .68);
    background: transparent;
    padding: 9px 14px; border-radius: 9px;
    transition: background .25s, color .25s;
  }
  .panel button:hover { color: #fff; background: rgba(255, 255, 255, .06); }
  .panel button[aria-pressed="true"] { color: #fff; background: rgba(255, 255, 255, .13); }
  .panel button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .sep { width: 1px; height: 22px; background: rgba(255, 255, 255, .12); }
  #btnWire .dot {
    display: inline-block; width: 7px; height: 7px; margin-right: 8px; vertical-align: 1px;
    border-radius: 2px; border: 1.2px solid currentColor; transform: rotate(45deg);
  }
  #btnWire[aria-pressed="true"] .dot { background: var(--accent); border-color: var(--accent); }
  @media (max-width: 520px) {
    .panel { gap: 6px; bottom: 14px; }
    .panel button { padding: 8px 10px; font-size: 12px; }
  }
</style>
</head>

    <!-- резьба: грива, щека, чёлка, глаз, ноздря -->
    <g clip-path="url(#cBody)">
      <path d="M 201 46 C 193.8 56.2 188.8 74.2 189 92 C 195.2 75.8 200.2 57.8 201 46 Z" class="shf" opacity=".26" filter="url(#fb1)"/>
      <use href="#gStrands" class="str-hl" transform="translate(.8 .8)"/>
      <use href="#gStrands" class="str"/>
      <use href="#gGrooves" class="grv-hl" transform="translate(.9 .9)"/>
      <use href="#gGrooves" class="grv"/>

      <!-- глаз -->
      <g transform="translate(152 150) rotate(-32)">
        <ellipse cx="0" cy="0" rx="17" ry="11" class="shf" opacity=".14" filter="url(#fb3)"/>
        <path d="M -11 0 C -6 -6.5 5 -7.5 11 -1.5 C 6 5 -5 5.5 -11 0 Z" class="eye"/>
        <g clip-path="url(#cEye)">
          <ellipse cx="1" cy="-0.6" rx="5.4" ry="4.6" fill="url(#gIris)"/>
        </g>
        <ellipse cx="3.4" cy="-2.9" rx="1.9" ry="1.3" fill="#fff" opacity=".9"/>
        <path d="M -9.6 2.8 C -4 6.6 5 6.2 10.4 0.8" class="hls" stroke-width=".9" stroke-linecap="round" opacity=".6"/>
      </g>
    </g>

    <!-- контровой свет по краю силуэта -->
    <g clip-path="url(#cBody)">
      <use href="#pBody" class="rimk" stroke-width="2.6" mask="url(#mKey)"/>
      <use href="#pBody" class="rimb" stroke-width="3.2" mask="url(#mBack)" filter="url(#fRim)"/>
    </g>

    <!-- воротничок поверх шеи -->
    <use href="#pCollar" class="fbs"/>
    <use href="#pCollar" fill="url(#gRingV)"/>
    <g class="hl-group">
      <ellipse cx="170" cy="396.2" rx="36" ry="1.3" class="hlf" opacity=".6" filter="url(#fb1)"/>
    </g>
  </g>

  <!-- каркас: опорные точки и рычаги кривых Безье -->
  <g id="wire"></g>
</svg>

<div class="hud">
  <h1>Шахматный конь</h1>
  <p>Инлайн-SVG без растра · <span id="stat">кривые Безье</span></p>
</div>

<div class="panel" role="toolbar" aria-label="Управление">
  <div class="seg" role="group" aria-label="Материал">
    <button type="button" data-theme="ivory" aria-pressed="true" title="Клавиша 1">Слоновая кость</button>
    <button type="button" data-theme="ebony" aria-pressed="false" title="Клавиша 2">Эбен</button>
  </div>
  <span class="sep" aria-hidden="true"></span>
  <button type="button" id="btnWire" aria-pressed="false" title="Клавиша B"><span class="dot"></span>Каркас Безье</button>
</div>

<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var root = document.documentElement;
  var stage = document.getElementById('stage');

  // Разбор абсолютных команд M/L/C/Z (контуры написаны только ими)
  function parsePath(d) {
    var tok = d.match(/[MLCZmlcz]|-?\d*\.?\d+(?:e[-+]?\d+)?/g) || [];
    var i = 0, cmd = null, cur = [0, 0], start = [0, 0], out = [];
    function num() { return parseFloat(tok[i++]); }
    while (i < tok.length) {
      if (/[A-Za-z]/.test(tok[i])) cmd = tok[i++].toUpperCase();
      if (cmd === 'M') {
        cur = [num(), num()]; start = cur.slice();
        out.push({ t: 'M', p: cur }); cmd = 'L';
      } else if (cmd === 'L') {
        var p = [num(), num()];
        out.push({ t: 'L', p0: cur, p: p }); cur = p;
      } else if (cmd === 'C') {
        var c1 = [num(), num()], c2 = [num(), num()], q = [num(), num()];
        out.push({ t: 'C', p0: cur, c1: c1, c2: c2, p: q }); cur = q;
      } else if (cmd === 'Z') {
        out.push({ t: 'Z' }); cur = start.slice(); cmd = null;
      } else {
        i++;
      }
    }
    return out;
  }

  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    e.setAttribute('vector-effect', 'non-scaling-stroke');
    parent.appendChild(e);
    return e;
  }

  function buildWire() {
    var wire = document.getElementById('wire');
    var ids = ['pEar2', 'pBody', 'pFoot', 'pCove', 'pTorus', 'pCollar'];
    var gPaths = el('g', {}, wire), gHandles = el('g', {}, wire),
        gCtrls = el('g', {}, wire), gAnchors = el('g', {}, wire);
    var curves = 0, seen = {};
    function anchor(p) {
      var key = p[0] + ',' + p[1];
      if (seen[key]) return; seen[key] = 1;
      el('rect', { x: p[0] - 1.6, y: p[1] - 1.6, width: 3.2, height: 3.2, 'class': 'w-anchor' }, gAnchors);
    }
    ids.forEach(function (id) {
      var d = document.getElementById(id).getAttribute('d');
      el('path', { d: d, 'class': 'w-path' }, gPaths);
      parsePath(d).forEach(function (s) {
        if (s.t === 'C') {
          curves++;
          el('line', { x1: s.p0[0], y1: s.p0[1], x2: s.c1[0], y2: s.c1[1], 'class': 'w-handle' }, gHandles);
          el('line', { x1: s.c2[0], y1: s.c2[1], x2: s.p[0], y2: s.p[1], 'class': 'w-handle' }, gHandles);
          el('circle', { cx: s.c1[0], cy: s.c1[1], r: 1.45, 'class': 'w-ctrl' }, gCtrls);
          el('circle', { cx: s.c2[0], cy: s.c2[1], r: 1.45, 'class': 'w-ctrl' }, gCtrls);
          anchor(s.p);
        } else if (s.t === 'M' || s.t === 'L') {
          anchor(s.p);
        }
      });
    });
    return curves;
  }

  var curves = buildWire();
  document.getElementById('stat').textContent = 'контур: ' + curves + ' сегментов Безье';

  var themeBtns = Array.prototype.slice.call(document.querySelectorAll('.seg [data-theme]'));
  var wireBtn = document.getElementById('btnWire');

  function setTheme(name) {
    if (name === 'ebony') root.setAttribute('data-theme', 'ebony');
    else root.removeAttribute('data-theme');
    themeBtns.forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-theme') === name));
    });
  }
  function toggleWire(force) {
    var on = typeof force === 'boolean' ? force : !stage.classList.contains('wire-on');
    stage.classList.toggle('wire-on', on);
    wireBtn.setAttribute('aria-pressed', String(on));
  }

  themeBtns.forEach(function (b) {
    b.addEventListener('click', function () { setTheme(b.getAttribute('data-theme')); });
  });
  wireBtn.addEventListener('click', function () { toggleWire(); });
  window.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key.toLowerCase();
    if (k === '1') setTheme('ivory');
    else if (k === '2') setTheme('ebony');
    else if (k === 'b' || k === 'и') toggleWire();
  });
})();
</script>
</body>
</html>

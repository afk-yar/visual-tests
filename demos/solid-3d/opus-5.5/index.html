<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D-тело (софт-рендер) — Claude Opus 5.5</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="view" role="img" aria-label="Вращающееся 3D-тело, отрисованное программным растеризатором"></canvas>

<header class="hud" id="hud">
  <h1>Софт-рендер 3D</h1>
  <p class="sub">Свой конвейер на Canvas&nbsp;2D без WebGL: поворот&nbsp;→ перспектива&nbsp;→ отсечение нелицевых&nbsp;→ z-буфер&nbsp;→ точечный свет</p>
  <p class="stats"><span id="st1">…</span><br><span id="st2"></span></p>
  <p class="hint">Тяни мышью — вращать · W вид · S затенение · C отсечение · 1–3 тело · Пробел пауза</p>
</header>

<div class="panel" id="panel">
  <div class="group">
    <span class="glabel">Вид</span>
    <div class="seg" data-key="mode" role="group" aria-label="Вид">
      <button type="button" data-v="fill" title="Заливка (W)">Заливка</button>
      <button type="button" data-v="wire" title="Каркас со скрытыми линиями (W)">Каркас</button>
      <button type="button" data-v="both" title="Заливка + каркас (W)">Оба</button>
    </div>
  </div>
  <div class="group" id="g-shade">
    <span class="glabel">Затенение</span>
    <div class="seg" data-key="shading" role="group" aria-label="Затенение">
      <button type="button" data-v="flat" title="Плоское: один цвет на грань (S)">Плоское</button>
      <button type="button" data-v="gouraud" title="Гуро: свет в вершинах, интерполяция по пикселям (S)">Гуро</button>
    </div>
  </div>
  <div class="group">
    <span class="glabel">Тело</span>
    <div class="seg" data-key="obj" role="group" aria-label="Тело">
      <button type="button" data-v="torus" title="Тор (1)">Тор</button>
      <button type="button" data-v="knot" title="Узел-трилистник (2)">Узел</button>
      <button type="button" data-v="sphere" title="Икосфера, выпуклый многогранник (3)">Сфера</button>
    </div>
  </div>
  <div class="group">
    <span class="glabel">Конвейер</span>
    <button type="button" class="tog" id="cull" title="Отсечение нелицевых граней (C)">Отсечение</button>
  </div>
  <div class="group">
    <span class="glabel">Вращение <output id="spdv">1.00×</output></span>
    <div class="row">
      <input type="range" id="spd" min="0" max="3" step="0.05" value="1" aria-label="Скорость вращения">
      <button type="button" class="icon" id="pause" title="Пауза (Пробел)" aria-label="Пауза">
        <svg class="i-pause" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="3" y="2" width="3.6" height="12" rx="1"/><rect x="9.4" y="2" width="3.6" height="12" rx="1"/></svg>
        <svg class="i-play" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 2.2v11.6c0 .6.7 1 1.2.7l9-5.8c.5-.3.5-1.1 0-1.4l-9-5.8C4.7 1.2 4 1.6 4 2.2z"/></svg>
      </button>
    </div>
  </div>
</div>

<script src="main.js"></script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Аквариум с рыбами — Claude Opus 5</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="scene"></canvas>

<div class="hud">
  <h1>Аквариум</h1>
  <p>Canvas&nbsp;2D без библиотек · волновая кинематика тела, каустика дна, объёмный свет</p>
</div>

<div class="panel" id="panel">
  <div class="ctl">
    <label for="sFish">Рыбы</label>
    <input id="sFish" type="range" min="0.3" max="2" step="0.05" value="1" aria-label="Количество рыб">
    <output id="vFish">×1.0</output>
  </div>
  <div class="ctl">
    <label for="sLight">Свет</label>
    <input id="sLight" type="range" min="0" max="1.8" step="0.05" value="1" aria-label="Интенсивность света">
    <output id="vLight">×1.0</output>
  </div>
  <div class="ctl">
    <label for="sHaze">Мутность</label>
    <input id="sHaze" type="range" min="0" max="1.8" step="0.05" value="1" aria-label="Мутность воды">
    <output id="vHaze">×1.0</output>
  </div>
  <div class="ctl">
    <label for="sFlow">Течение</label>
    <input id="sFlow" type="range" min="0.2" max="2" step="0.05" value="1" aria-label="Скорость течения">
    <output id="vFlow">×1.0</output>
  </div>
  <div class="sep" aria-hidden="true"></div>
  <div class="btns">
    <button id="bFeed" type="button">Покормить</button>
    <button id="bPause" type="button">Пауза</button>
  </div>
  <div class="note">клик по сцене — корм</div>
</div>

<script src="main.js"></script>
</body>
</html>

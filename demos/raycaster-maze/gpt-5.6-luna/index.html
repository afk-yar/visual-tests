<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Рейкастер-лабиринт — GPT-5.6 Luna</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="scene" aria-label="Псевдо-3D лабиринт. Управление клавишами W, S, A, D и стрелками."></canvas>

  <main class="interface">
    <header class="hud-header">
      <div class="brand-lockup">
        <span class="brand-orbit" aria-hidden="true"></span>
        <div>
          <div class="eyebrow">LUNA / RAYCASTER MAZE</div>
          <h1>Лунный проход</h1>
        </div>
      </div>
      <div class="hud-status" aria-live="polite">
        <span class="status-dot"></span>
        <span id="stateLabel">СИСТЕМА ГОТОВА</span>
      </div>
    </header>

    <div class="crosshair" aria-hidden="true">
      <span class="crosshair-line crosshair-line--top"></span>
      <span class="crosshair-line crosshair-line--right"></span>
      <span class="crosshair-line crosshair-line--bottom"></span>
      <span class="crosshair-line crosshair-line--left"></span>
      <span class="crosshair-core"></span>
    </div>

    <aside class="control-panel" aria-label="Управление лабиринтом">
      <div class="panel-group panel-group--intro">
        <span class="panel-kicker">ОПЕРАТОРСКИЙ КАНАЛ</span>
        <strong>Найди выход из сетки</strong>
        <span class="panel-note">Лабиринт генерируется заново при каждом запуске</span>
      </div>

      <div class="panel-group control-keys">
        <span class="panel-kicker">ПЕРЕДВИЖЕНИЕ</span>
        <div class="key-row">
          <span class="key key--wide">W</span>
          <span class="key key--wide">S</span>
          <span class="key">A</span>
          <span class="key">D</span>
          <span class="key key--arrow">←</span>
          <span class="key key--arrow">→</span>
        </div>
        <span class="panel-note">ходьба · стрейф · поворот</span>
      </div>

      <div class="panel-group panel-readouts">
        <div class="readout"><span>ПОЗИЦИЯ</span><strong id="positionReadout">01.50 / 01.50</strong></div>
        <div class="readout"><span>ГЛУБИНА</span><strong id="depthReadout">00.0 m</strong></div>
      </div>

      <button class="new-maze-button" id="newMaze" type="button">
        <span>Новый маршрут</span>
        <span class="button-arrow" aria-hidden="true">↗</span>
      </button>
    </aside>
  </main>

  <script src="main.js"></script>
</body>
</html>

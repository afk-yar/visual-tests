<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>«Идущий человечек» — «Kimi K3»</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="scene"></canvas>

<header class="hud">
  <h1>«Идущий человечек»</h1>
  <p>Kimi K3 · процедурная походка, IK, без спрайтов</p>
</header>

<div class="panel">
  <label class="panel-label" for="speed">Скорость</label>
  <input id="speed" type="range" min="0" max="100" value="30" step="1" aria-label="Скорость ходьбы">
  <div class="readout">
    <span id="speed-val">—</span>
    <span id="gait-label" class="gait">—</span>
  </div>
</div>

<script src="main.js"></script>
</body>
</html>

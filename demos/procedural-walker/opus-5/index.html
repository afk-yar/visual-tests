<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Идущий человечек — Claude Opus 5</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<div class="hud">
  <h1>Идущий человечек</h1>
  <p>Процедурная походка без спрайтов: колени через обратную кинематику, фазы опоры и переноса, руки в противофазе. Опорная стопа прибита к земле.</p>
</div>

<div class="panel">
  <div class="row">
    <label class="lbl" for="speed">Скорость</label>
    <input id="speed" class="range" type="range" min="0" max="1" step="0.001" value="0.22" aria-label="Скорость походки">
    <span id="kmh" class="val">—</span>
  </div>
  <div id="readout" class="readout">—</div>
  <div class="row btns">
    <button id="btnPause" type="button">Пауза</button>
    <button id="btnSlow" type="button">Замедление</button>
    <button id="btnSkel" type="button">Скелет</button>
    <button id="btnPrints" type="button" class="on">Следы</button>
  </div>
</div>

<script src="main.js"></script>
</body>
</html>
